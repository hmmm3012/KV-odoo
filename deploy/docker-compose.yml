# KV Odoo STAGING — separate project, never touches production
name: kv-odoo-staging

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: "1.0"

  odoo:
    image: kv-odoo:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8169}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT:-8172}:8072"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-True}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-0}
      ODOO_GEVENT_PORT: "8072"
      ODOO_LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-1073741824}
      ODOO_LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-1610612736}
      ODOO_LIMIT_MEMORY_SOFT_GEVENT: ${ODOO_LIMIT_MEMORY_SOFT_GEVENT:-536870912}
      ODOO_LIMIT_MEMORY_HARD_GEVENT: ${ODOO_LIMIT_MEMORY_HARD_GEVENT:-805306368}
      ODOO_LIMIT_TIME_REAL: ${ODOO_LIMIT_TIME_REAL:-120}
      ODOO_LIMIT_TIME_CPU: ${ODOO_LIMIT_TIME_CPU:-60}
      ODOO_LIMIT_REQUEST: ${ODOO_LIMIT_REQUEST:-8192}
      ATTENDANCE_FACE_JOB_SLOTS: ${ATTENDANCE_FACE_JOB_SLOTS:-1}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENCV_FOR_THREADS_NUM: "1"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../addons:/opt/odoo/addons:ro
      - ../custom:/opt/odoo/custom
      - ../odoo:/opt/odoo/odoo:ro
      - ../utils:/opt/odoo/utils:ro
      # Host template so list_db/db_name/dbfilter changes apply without image rebuild
      - ./odoo.conf.template:/opt/odoo/deploy/odoo.conf.template:ro
    mem_limit: 3g
    cpus: "2.0"
    networks:
      - default
      - ai-gateway-internal

networks:
  ai-gateway-internal:
    name: ai-gateway-prod-internal
    external: true

volumes:
  odoo-db-data:
  odoo-web-data:
    name: kv-odoo-staging_odoo-web-data
    external: true
