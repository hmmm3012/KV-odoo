# KV Odoo — production-oriented stack (build from repo root context)
name: kv-odoo

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  odoo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kv-odoo:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT:-8072}:8072"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-True}
      ODOO_WORKERS: ${ODOO_WORKERS:-6}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_GEVENT_PORT: ${ODOO_GEVENT_PORT:-8072}
      ATTENDANCE_FACE_JOB_SLOTS: ${ATTENDANCE_FACE_JOB_SLOTS:-4}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENCV_FOR_THREADS_NUM: "1"
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-}
      ODOO_UPDATE_MODULES: ${ODOO_UPDATE_MODULES:-}
    volumes:
      - odoo-web-data:/var/lib/odoo

volumes:
  odoo-db-data:
  odoo-web-data:
