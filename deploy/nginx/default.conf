# Rendered at container start; upstream host is the odoo service name on the compose network.

upstream odoo_backend {
    server odoo:8069;
}

upstream odoo_websocket {
    server odoo:8072;
}

# Timeouts for large reports / slow imports
proxy_read_timeout 720s;
proxy_connect_timeout 720s;
proxy_send_timeout 720s;

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # Optional: redirect HTTP to HTTPS when TLS is enabled (uncomment in prod with certs)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://odoo_backend;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/json application/javascript application/xml;
}

