# Production: nginx reverse proxy, multi-worker Odoo, no direct Odoo port on the host.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  odoo:
    ports: []
    expose:
      - "8069"
      - "8072"
    environment:
      ODOO_PROXY_MODE: "True"
      ODOO_WORKERS: ${ODOO_WORKERS:-4}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-2}
      ODOO_GEVENT_PORT: ${ODOO_GEVENT_PORT:-8072}
      ODOO_LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-2147483648}
      ODOO_LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-2684354560}
      ODOO_LIMIT_MEMORY_SOFT_GEVENT: ${ODOO_LIMIT_MEMORY_SOFT_GEVENT:-1048576000}
      ODOO_LIMIT_MEMORY_HARD_GEVENT: ${ODOO_LIMIT_MEMORY_HARD_GEVENT:-1153433600}
      ODOO_LIMIT_TIME_REAL: ${ODOO_LIMIT_TIME_REAL:-120}
      ODOO_LIMIT_TIME_CPU: ${ODOO_LIMIT_TIME_CPU:-60}
      ODOO_LIMIT_REQUEST: ${ODOO_LIMIT_REQUEST:-8192}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
